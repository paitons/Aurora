<style>
:root{--bg:#090A0C;--p:#0E1013;--l:#20242A;--l2:#2E333A;--t:#C6CBD0;--m:#7C858E;--d:#4A5159;--a:#86E5A3;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:13px/1.4 var(--mono);-webkit-text-size-adjust:100%;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--l);font-size:11px;color:var(--m)}
#top b{color:var(--t);font-weight:500}
#top button{margin-left:auto}
#top{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
button{font:inherit;background:none;border:1px solid var(--l2);color:var(--t);padding:5px 9px;cursor:pointer;border-radius:0;font-size:12px}
button:focus-visible{outline:1px solid var(--a);outline-offset:1px}
#mapwrap{position:relative;background:#07080A;touch-action:none;overflow:hidden;min-height:0}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.mctrl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mctrl button{width:36px;height:36px;padding:0;font-size:17px;background:rgba(9,10,12,.85)}
.mctrl button[aria-pressed="true"]{background:var(--t);color:var(--bg)}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;background:var(--t);color:var(--bg);padding:4px 10px;pointer-events:none;white-space:nowrap}
#leg{position:absolute;left:8px;bottom:8px;font-size:10px;color:var(--m);background:rgba(9,10,12,.8);padding:3px 6px;line-height:1.45;max-width:78%}
#leg i{display:inline-block;width:14px;height:8px;background:var(--a);opacity:.5;vertical-align:middle;margin-right:4px}
.lbl{font:11px var(--mono);fill:var(--t);paint-order:stroke;stroke:#07080A;stroke-width:3.5px;pointer-events:none;font-weight:500}
.lbl.big{font-size:13px;font-weight:700;fill:var(--a)}
.lbl.dim{fill:var(--m);font-weight:400}
#card{border-top:1px solid var(--l);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--p)}
#t1{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
#t1.a{color:var(--a)}
#t2{color:var(--t);margin-top:4px;font-size:13px;line-height:1.4}
#t3{color:var(--m);margin-top:5px;font-size:11px;line-height:1.4}
#t3 .al{color:var(--a)}
#go{margin-top:9px}
#alt{margin-top:7px;font-size:11px;color:var(--m)}
#alt span{color:var(--t);text-decoration:underline;text-decoration-color:var(--l2);cursor:pointer;margin-right:10px}
#bars{margin-top:9px;border-top:1px solid var(--l);padding-top:7px;display:grid;grid-template-columns:auto 1fr 34px;gap:4px 8px;align-items:center;font-size:11px}
#bars .k{color:var(--m);white-space:nowrap}
#bars .bar{height:7px;background:var(--l);position:relative}
#bars .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--t)}
#bars .bar i.a{background:var(--a)}
#bars .v{text-align:right;color:var(--t)}
#bars .sub{grid-column:1/4;font-size:10px;color:var(--d);margin-top:-2px}
#gpsI{color:var(--d)}#gpsI.on{color:var(--a)}
#go{display:block;text-align:center;text-decoration:none;margin-top:9px;background:var(--a);color:var(--bg);font-weight:700;padding:11px 14px;font-size:14px}
#go.off{background:var(--l);color:var(--d);pointer-events:none}
[hidden]{display:none!important}
</style>

function zoomAt(cx,cy,f){const r=svg.getBoundingClientRect(),s=upp(),wx=view.x+(cx-r.left)*s,wy=view.y+(cy-r.top)*s;const w=clamp(view.w*f,40,6000),s2=w/r.width;setView({x:wx-(cx-r.left)*s2,y:wy-(cy-r.top)*s2,w,h:0})}
function contours(V,lons,lats,level){const segs=[];const n=lats.length,m=lons.length;
 for(let i=0;i<n-1;i++)for(let j=0;j<m-1;j++){const a=V[i][j],b=V[i][j+1],c=V[i+1][j+1],d=V[i+1][j];const idx=(a>=level?8:0)|(b>=level?4:0)|(c>=level?2:0)|(d>=level?1:0);if(idx===0||idx===15)continue;
  const x0=lons[j],x1=lons[j+1],y0=lats[i],y1=lats[i+1];const L=(p,q,v1,v2)=>p+(q-p)*((level-v1)/((v2-v1)||1e-9));
  const top=[L(x0,x1,a,b),y0],right=[x1,L(y0,y1,b,c)],bot=[L(x0,x1,d,c),y1],left=[x0,L(y0,y1,a,d)];
  const T={1:[left,bot],2:[bot,right],3:[left,right],4:[top,right],5:[top,left,bot,right],6:[top,bot],7:[top,left],8:[top,left],9:[top,bot],10:[top,right,left,bot],11:[top,right],12:[left,right],13:[bot,right],14:[left,bot]}[idx];
  for(let k=0;k<T.length;k+=2)segs.push([T[k],T[k+1]])}
 return segs}
function drawMap(){gOv.innerHTML="";gCt.innerHTML="";gRd.innerHTML="";
 const ov=S.P?.ov;const useOv=ov&&ov.cells.length&&!S.ovStale;
 const probAt=useOv?(lon,lat)=>ovAt(lon,lat):(()=>{const p=kpToProb(S.P?.kp1h??S.P?.kpNow?.v);return(lon,lat)=>p==null?0:clamp(p*(1-Math.abs(lat-66.2)*0.22),0,100)})();
 const st=0.25,lons=[],lats=[],V=[];for(let lat=62.5;lat<=66.75;lat+=st)lats.push(+lat.toFixed(2));for(let lon=-25;lon<=-12.75;lon+=st)lons.push(+lon.toFixed(2));
 lats.forEach(lat=>{V.push(lons.map(lon=>probAt(lon,lat)||0))});
 for(let i=0;i<lats.length-1;i++)for(let j=0;j<lons.length-1;j++){const p=(V[i][j]+V[i][j+1]+V[i+1][j]+V[i+1][j+1])/4;if(p<4)continue;
  el("rect",{x:PX(lons[j]),y:PY(lats[i+1]),width:438*st+2,height:1000*st+2,fill:"var(--a)",opacity:(clamp(p/100,0,1)*0.6).toFixed(2)},gOv)}
 for(const[lev,dash,op]of[[20,"8 6",.8],[50,"",1]]){const segs=contours(V,lons,lats,lev);if(!segs.length)continue;
  el("path",{d:segs.map(([a,b])=>`M${PX(a[0]).toFixed(1)} ${PY(a[1]).toFixed(1)}L${PX(b[0]).toFixed(1)} ${PY(b[1]).toFixed(1)}`).join(""),fill:"none",stroke:"var(--a)","stroke-width":lev===50?1.8:1.2,"stroke-dasharray":dash,opacity:op,"vector-effect":"non-scaling-stroke","stroke-linecap":"round"},gCt)}
 for(const s of roadSegs()){if(s.fac>=1||s.pts.length<2)continue;el("path",{d:line(s.pts),fill:"none",stroke:s.fac===0?"#C6CBD0":"#7C858E","stroke-width":s.fac===0?3:2,"stroke-dasharray":s.fac===0?"6 4":"2 4","vector-effect":"non-scaling-stroke"},gRd)}
 $("leg").innerHTML=`<i></i>${useOv?"verde = aurora sopra la testa, 30-40 min":"verde = stima da Kp (OVATION assente)"}<br>linea piena 50%, tratteggiata 20%, ▲ dove andare`;
 drawPins()}
function drawPins(){gPin.innerHTML="";const s=upp(),sc=`scale(${s})`;
 const list=S.cand.length?S.cand:CAND.map((c,i)=>({i,name:c[0],lon:c[1],lat:c[2]}));
 list.forEach(c=>{const x=PX(c.lon),y=PY(c.lat),best=S.best===c,topI=S.top?S.top.indexOf(c):-1,sel=S.view===c;
  const g=el("g",{transform:`translate(${x} ${y}) ${sc}`,class:"pin",role:"button","aria-label":c.name},gPin);
  if(best){el("path",{d:"M0 -2 L9 12 L-9 12Z",fill:"var(--a)",stroke:"#07080A","stroke-width":2,transform:"translate(0 -12)"},g);el("circle",{r:3,fill:"#07080A"},g);
   const t=el("text",{x:0,y:-20,"text-anchor":"middle",class:"lbl big"},g);t.textContent=c.name.split(",")[0]+(c.eta!=null?", "+Math.round(c.eta)+" min":"")}
  else{el("circle",{r:sel?6:topI>=0?4.5:3,fill:sel?"var(--a)":topI>=0?"#C6CBD0":"#555C64",stroke:"#07080A","stroke-width":1.5},g);
   if(sel||s<0.55){const t=el("text",{x:8,y:3.5,class:"lbl"+(sel?"":" dim")},g);t.textContent=c.name.split(",")[0]}}
  el("circle",{r:11,fill:"transparent"},g);
  g.addEventListener("click",ev=>{ev.stopPropagation();if(moved)return;if(tapMode){tapMode=false;$("tap").setAttribute("aria-pressed","false");$("hint").hidden=true;setPos([c.lon,c.lat],c.name.split(",")[0]);return}
   S.view=(S.best===c)?null:c;renderCard();drawPins()})});
 if(S.pos){const x=PX(S.pos[0]),y=PY(S.pos[1]);const g=el("g",{transform:`translate(${x} ${y}) ${sc}`},gPin);
  el("circle",{r:10,fill:"none",stroke:"#C6CBD0","stroke-width":1.5},g);el("circle",{r:3,fill:"#C6CBD0"},g);const t=el("text",{x:0,y:24,"text-anchor":"middle",class:"lbl"},g);t.textContent="voi"}}
/* pan/zoom/tap */
let ptrs=new Map(),start=null,moved=false,pinch=null,tapMode=false;
svg.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={x:e.clientX,y:e.clientY,v:{...view}};if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:view.w}}});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];moved=true;const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,(pinch.w*pinch.d/d)/view.w);return}
 const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!moved&&Math.hypot(dx,dy)>6){moved=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}}
 if(moved&&ptrs.size===1){const s=start.v.w/svg.getBoundingClientRect().width;setView({x:start.v.x-dx*s,y:start.v.y-dy*s,w:start.v.w,h:0})}});
const up=e=>{const was=moved;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
 if(!was&&ptrs.size===0&&tapMode&&!e.target.closest(".pin")){const r=svg.getBoundingClientRect(),s=upp();const lon=(view.x+(e.clientX-r.left)*s)/438-23.5,lat=64.8-(view.y+(e.clientY-r.top)*s)/1000;tapMode=false;$("tap").setAttribute("aria-pressed","false");$("hint").hidden=true;setPos([+lon.toFixed(4),+lat.toFixed(4)],"tap")}
 setTimeout(()=>{if(!ptrs.size)moved=false},0)};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0016))},{passive:false});
$("zin").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.6)};
$("zout").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/.6)};
function setTap(on){tapMode=on;$("tap").setAttribute("aria-pressed",on);$("hint").hidden=!on}
$("tap").onclick=()=>setTap(!tapMode);
function setPos(p,src){S.pos=p;S.posSrc=src;S.view=null;saveState();log("posizione ("+src+")");if(S.P){evaluate();render();fitReach()}else drawPins()}
let watchId=null;
function startGps(quiet){if(!navigator.geolocation){if(!quiet)setTap(true);return}
 $("gpsI").textContent="GPS…";watchId=navigator.geolocation.watchPosition(g=>{const p=[+g.coords.longitude.toFixed(4),+g.coords.latitude.toFixed(4)];$("gpsI").className="on";$("gpsI").textContent="GPS "+hm(new Date());if(!S.pos||hav(S.pos,p)>0.3)setPos(p,"gps")},err=>{watchId=null;$("gpsI").className="";$("gpsI").textContent="GPS no";if(!S.pos)setTap(true)},{enableHighAccuracy:true,maximumAge:30000,timeout:20000})}
$("gps").onclick=()=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;$("gpsI").className="";$("gpsI").textContent="GPS off";return}startGps(false)};
$("btnNow").onclick=()=>refresh(true);
setInterval(()=>refresh(false),5*60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-S.lastRefresh>3*60000)refresh(false)});
window.addEventListener("online",()=>refresh(false));
setInterval(()=>{$("clock").textContent=hm(new Date());if(S.P)render()},30000);$("clock").textContent=hm(new Date());
new ResizeObserver(()=>{const cx=view.x+view.w/2,cy=view.y+view.h/2;const v={...view};setView(v);view.x=cx-view.w/2;view.y=cy-view.h/2;svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)}).observe($("mapwrap"));
let fitted=false;
requestAnimationFrame(()=>{fitAll();renderCard();if(!S.pos)startGps(true);refresh(false).then(()=>{if(!fitted&&S.dj){fitReach();fitted=true}})});
</script>
